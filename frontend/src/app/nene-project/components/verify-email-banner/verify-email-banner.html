@if(show()){
  <div
    class="px-4 py-3 flex flex-wrap items-center justify-between gap-3 rounded-none bg-pink-100 border-4 border-pink-300 shadow-[4px_4px_0_#db2777]"
    [class]="classAttribute()"
  >
    <p class="font-pixel font-bold text-pink-500">
      Please verify your email to unlock gacha pulls, tanzaku and the pet shop!
    </p>
    <div class="flex items-center gap-3">
      @if(resendState() === 'sent'){
        <span class="font-pixel font-bold text-green-600">Email sent! Check your inbox </span>
      } @else {
        <button
          type="button"
          (click)="resend()"
          [disabled]="resendState() === 'sending'"
          class="px-3 py-1 rounded-none font-pixel font-bold text-white bg-pink-400 border-2 border-pink-500 shadow-[2px_2px_0_#db2777] hover:bg-pink-500 disabled:opacity-60 cursor-pointer transition-colors"
        >
          {{ resendState() === 'sending' ? 'Sending...' : 'Resend email' }}
        </button>
      }
      @if(dismissible()){
        <button
          type="button"
          (click)="dismissed.set(true)"
          aria-label="Dismiss verification banner"
          class="font-pixel font-black text-pink-500 hover:text-pink-400 cursor-pointer"
        >
          ✕
        </button>
      }
    </div>
  </div>
}
