<div
  class="relative w-70 md:w-80 aspect-4/3 rounded-lg overflow-hidden border-2 md:border-4 ease-out will-change-transform hover:scale-110 transition-transform hover:-translate-y-2 hover:z-50 cursor-pointer"
  (click)="viewItem(item())"
  [class.border-green-400]="item().rarity === 'N'"
  [class.shadow-[0_0_15px_#4ade80]]="item().rarity === 'N'"
  [class.border-blue-400]="item().rarity === 'R'"
  [class.shadow-[0_0_15px_#60a5fa]]="item().rarity === 'R'"
  [class.border-purple-500]="item().rarity === 'SR'"
  [class.shadow-[0_0_20px_#a855f7]]="item().rarity === 'SR'"
  [class.border-yellow-400]="item().rarity === 'SSR'"
  [class.shadow-[0_0_25px_#facc15]]="item().rarity === 'SSR'"
>
  @if (item().rarity === 'SSR') {
    <div
      class="absolute inset-0 z-20 pointer-events-none bg-[radial-gradient(circle_at_center,transparent_50%,#fef08a_120%)] animate-pulse opacity-70"
    ></div>
  }
  <img
    [src]="item().url"
    [alt]="item().name"
    class="w-full h-full object-cover z-10 relative"
    [class.animate-pulse]="item().rarity === 'SSR'"
  />
  <div
    class="absolute bottom-0 inset-x-0 bg-linear-to-t from-black/80 via-black/40 to-transparent p-2 pt-6 z-30 text-center"
  >
    <span
      class="inline-block px-1.5 py-0.5 rounded text-[10px] font-black mb-0.5 text-white backdrop-blur-sm shadow-sm"
      [class.bg-green-500]="item().rarity === 'N'"
      [class.bg-blue-500]="item().rarity === 'R'"
      [class.bg-purple-500]="item().rarity === 'SR'"
      [class.bg-yellow-500]="item().rarity === 'SSR'"
    >
      {{ item().rarity }}
    </span>
    <p
      class="text-sm md:text-base font-black text-white drop-shadow-[0_2px_4px_rgba(0,0,0,0.8)] truncate px-1"
    >
      {{ item().name }}
    </p>
  </div>
</div>
