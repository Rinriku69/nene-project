<app-sakura-component></app-sakura-component>
<div
  class="relative aimate-pulse p-2 sm:p-3 lg:p-2 md:p-2 font-sans text-pink-900 bg-blue-950 flex flex-col items-center gap-2"
>
  <div
    #sakuraImg
    class="relative min-w-full flex-1 overflow-hiddens"
    (click)="togglePlacementMode()"
    (mousemove)="updateGhostPosition($event)"
  >
    <img src="images/sakurajpg.jpg" alt="sakura tree" class="w-full" />
    <button
      class="absolute border-3 border-pink-500 animate-pulse top-5 left-10 bg-white p-5 rounded-2xl text-xl font-medium hover:bg-slate-200 cursor-pointer"
    >
      Add Tanzaku
    </button>

    <div
      class="absolute pointer-events-none translate-x-[-50%] translate-y-[20%]"
      [style.left.%]="ghostX()"
      [style.top.%]="ghostY()"
    >
      <div
        class="relative w-12 h-32 bg-pink-300 shadow-lg shadow-yellow-300 flex justify-center items-center font-semibold"
      >
      <div class="absolute h-5 w-2 bg-amber-800 bottom-full"></div>
        Hey
      </div>
    </div>
  </div>
</div>
