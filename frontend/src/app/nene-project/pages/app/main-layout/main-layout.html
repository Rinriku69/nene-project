<div class="min-h-screen lg:pb-14 flex flex-col">
  <div
    class="bg-pink-50 bg-[radial-gradient(#fbcfe8_6px,transparent_3px)] bg-size-[40px_40px] fixed inset-0 z-0"
  ></div>
  <nav class="top-0 z-50 px-2 py-2 md:py-2 md:px-5 sm:px-2  ">
    <div
      class="flex flex-wrap items-center justify-between gap-4 px-6 py-2 md:py-2 lg:py-3 rounded-3xl bg-white/80 backdrop-blur-md border-4 border-pink-200 shadow-[0_8px_0_#fbcfe8] w-full"
    >
      <div
        class="size-19 lg:size-24 md:size-24 relative bg-pink-300 rounded-4xl hover:scale-110 hover:rotate-3 transition-transform cursor-pointer flex gap-2 items-center shrink-0"
      >
        <img src="icons/nene_flower.png" alt="Nene flower logo" routerLink="/app/dashboard">
        <span class="absolute right-1 px-1 bottom-0 rounded-2xl font-black text-secondary bg-brand-pink">Nene</span>
      </div>

      <ul class="flex  flex-wrap justify-center items-center gap-1 md:gap-5 lg:gap-2 flex-1 ">
        <li>
          <a class="nav-list block" routerLink="/app/gacha" routerLinkActive="nav-list-active"
            >Gacha</a
          >
        </li>
        <li>
          <a class="nav-list block" routerLink="/app/inventory" routerLinkActive="nav-list-active"
            >Inventory</a
          >
        </li>
        <li>
          <a class="nav-list block"  routerLinkActive="nav-list-active"
            >Safe Zone</a
          >
        </li>
        <li>
          <a class="nav-list block">Co-op Mission</a>
        </li>
        @if (currentUser() && currentUser()?.role === 'admin') {
          <li>
            <a class="nav-list block" routerLink="/admin/userManagement">User</a>
          </li>
        }
      </ul>

      @if (currentUser()) {
        <div class="relative group shrink-0 z-50 w-auto" (click)="toggleUserMenu()">
          <div
            class="font-black flex items-center gap-3 text-lg md:text-xl text-pink-500 bg-pink-100 px-6 py-3 rounded-full border-2 border-pink-300 shadow-[0_4px_0_#fbcfe8] group-hover:-translate-y-1 group-hover:shadow-[0_6px_0_#fbcfe8] group-hover:bg-pink-200 active:translate-y-1 active:shadow-none transition-all cursor-pointer"
          >
            <span class="flex items-center gap-1 text-pink-400 " id="user-currency">
              💎 {{ currentUser()?.currency | number }}
            </span>
            <div class="w-0.5 h-5 bg-pink-300 rounded-full"></div>
            <span>{{ currentUser()?.username }}</span>
            <app-icons [name]="'downIcon'"></app-icons>
          </div>

          <div
            class="absolute right-0 top-full pt-3 w-56 opacity-0 pointer-events-none group-hover:opacity-100 group-hover:pointer-events-auto transition-all duration-300 transform origin-top-right scale-95 group-hover:scale-100"
            [class.opacity-100]="userMenuShow()"
            [class.!pointer-events-auto]="userMenuShow()"
            [class.opacity-0]="!userMenuShow()"
          >
            <div
              class="bg-white rounded-3xl border-4 border-pink-200 shadow-[0_8px_0_#fbcfe8] overflow-hidden p-2 flex flex-col gap-1"
            >
              <a
                class="flex px-4 py-3 text-pink-500 font-black hover:bg-pink-100 hover:text-pink-600 hover:-translate-y-0.5 rounded-2xl transition-all cursor-pointer items-center gap-3"
              >
                <app-icons [name]="'user'"></app-icons>
                Profile
              </a>
              <div class="h-1 bg-pink-100/60 rounded-full my-1 mx-2"></div>
              <a
                class="flex px-4 py-3 text-red-400 font-black hover:bg-red-50 hover:text-red-500 hover:-translate-y-0.5 rounded-2xl transition-all cursor-pointer items-center gap-3"
                (click)="logout()"
              >
                <app-icons [name]="'logout'"></app-icons>
                Logout
              </a>
            </div>
          </div>
        </div>
      } @else {
        <a
          routerLink="/auth/login"
          class="font-black block text-lg md:text-xl text-pink-500 bg-pink-100 px-6 py-3 rounded-full border-2 border-pink-300 shadow-[0_4px_0_#fbcfe8] hover:-translate-y-1 hover:shadow-[0_6px_0_#fbcfe8] hover:bg-pink-200 active:translate-y-1 active:shadow-none transition-all cursor-pointer shrink-0"
        >
          Please Login
        </a>
      }
    </div>
  </nav>
  <router-outlet></router-outlet>
</div>
