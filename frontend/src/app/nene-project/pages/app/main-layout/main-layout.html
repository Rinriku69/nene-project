<div class="min-h-screen">
  <nav class="sticky top-0 z-50 px-4 py-4 md:px-8">

    <div class="flex flex-wrap items-center justify-between gap-4 px-6 py-4 rounded-3xl bg-white/80 backdrop-blur-md border-4 border-pink-200 shadow-[0_8px_0_#fbcfe8]">

      <div class="font-black text-2xl md:text-3xl text-pink-400 tracking-tighter hover:scale-110 hover:rotate-3 transition-transform cursor-pointer drop-shadow-sm shrink-0">
        LOGO APP 
      </div>

      <ul class="flex flex-wrap justify-center items-center gap-2 md:gap-4 lg:gap-8 flex-1">
        <li>
          <a class="nav-list block" routerLink="./gacha">Gacha</a>
        </li>
        <li>
          <a class="nav-list block">Safe Zone</a>
        </li>
        <li>
          <a class="nav-list block">Co-op Mission</a>
        </li>
      </ul>

      @if(currentUser()){
        <div class="relative group shrink-0 z-50">
          <div class="font-black flex items-center gap-2 text-lg md:text-xl text-pink-500 bg-pink-100 px-6 py-3 rounded-full border-2 border-pink-300 shadow-[0_4px_0_#fbcfe8] group-hover:-translate-y-1 group-hover:shadow-[0_6px_0_#fbcfe8] group-hover:bg-pink-200 active:translate-y-1 active:shadow-none transition-all cursor-pointer">
            <span>{{currentUser()?.username}}</span>
            <app-icons [name]="'downIcon'"></app-icons>
          </div>
          
          <div class="absolute right-0 top-full pt-3 w-56 opacity-0 pointer-events-none group-hover:opacity-100 group-hover:pointer-events-auto transition-all duration-300 transform origin-top-right scale-95 group-hover:scale-100">
            <div class="bg-white rounded-3xl border-4 border-pink-200 shadow-[0_8px_0_#fbcfe8] overflow-hidden p-2 flex flex-col gap-1">
              <a class="flex px-4 py-3 text-pink-500 font-black hover:bg-pink-100 hover:text-pink-600 hover:-translate-y-0.5 rounded-2xl transition-all cursor-pointer  items-center gap-3">
                <app-icons [name]="'user'"></app-icons>
                Profile
              </a>
              <div class="h-1 bg-pink-100/60 rounded-full my-1 mx-2"></div>
              <a class="flex px-4 py-3 text-red-400 font-black hover:bg-red-50 hover:text-red-500 hover:-translate-y-0.5 rounded-2xl transition-all cursor-pointer  items-center gap-3" (click)="logout()">
                <app-icons [name]="'logout'"></app-icons>
                Logout
              </a>
            </div>
          </div>
        </div>
      }@else {
        <a routerLink="/auth/login" class="font-black block text-lg md:text-xl text-pink-500 bg-pink-100 px-6 py-3 rounded-full border-2 border-pink-300 shadow-[0_4px_0_#fbcfe8] hover:-translate-y-1 hover:shadow-[0_6px_0_#fbcfe8] hover:bg-pink-200 active:translate-y-1 active:shadow-none transition-all cursor-pointer shrink-0">
          Please Login
        </a>
      }

    </div>
  </nav>
  <main>
    <router-outlet></router-outlet>
  </main>
</div>
