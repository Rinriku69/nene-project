<div
  class="relative bg-pink-50/60 min-h-screen min-w-screen z-1 flex items-start justify-center pt-12 md:pt-20 px-4"
>
  <div class="w-full max-w-md">
    <div
      class="bg-pink-400 border-4 border-pink-500 rounded-none px-4 py-2 flex items-center gap-2 shadow-[4px_4px_0_#db2777]"
    >
      <div class="w-3 h-3 bg-pink-200 rounded-none border-2 border-pink-300"></div>
      <div class="w-3 h-3 bg-pink-200 rounded-none border-2 border-pink-300"></div>
      <div class="w-3 h-3 bg-pink-200 rounded-none border-2 border-pink-300"></div>
      <span class="ml-2 font-pixel text-white text-sm tracking-wider">PROFILE</span>
    </div>

    <div
      class="bg-white border-4 border-t-0 border-pink-500 rounded-none p-6 md:p-8 shadow-[4px_8px_0_#db2777]"
    >
      <div class="flex flex-col items-center mb-8">
        <div class="relative group mb-4">
          <div
            class="w-36 h-36 md:w-40 md:h-40 rounded-full border-4 border-dashed border-pink-300 flex items-center justify-center p-1 transition-all duration-300 group-hover:border-pink-400 group-hover:rotate-10"
          >
            <div
              class="w-full h-full rounded-full border-4 border-pink-400 overflow-hidden bg-pink-100 shadow-[0_4px_0_#fbcfe8] transition-all duration-300 group-hover:shadow-[0_6px_0_#f9a8d4]"
            >
              @if (displayImageUrl()) {
                <img [src]="displayImageUrl()" alt="Profile" class="w-full h-full object-cover" />
              } @else {
                <div class="w-full h-full flex items-center justify-center bg-pink-100">
                  <app-icons
                    name="user"
                    classAttribute="w-16 h-16 md:w-20 md:h-20 text-pink-300"
                  ></app-icons>
                </div>
              }
            </div>
          </div>

          <label
            for="fileInput"
            class="absolute bottom-1 right-1 w-10 h-10 bg-pink-400 border-3 border-pink-500 rounded-full flex items-center justify-center cursor-pointer shadow-[2px_4px_0_#db2777] transition-all duration-200 hover:bg-pink-300 hover:translate-y-0.5 hover:shadow-[0_2px_0_#db2777] active:translate-y-1 active:shadow-none"
          >
            <app-icons name="camera" classAttribute="w-5 h-5 text-white"></app-icons>
          </label>
        </div>

        <input
          id="fileInput"
          type="file"
          accept="image/*"
          (change)="onFileSelected($event)"
          class="hidden"
        />

        @if (selectedFile()) {
          <div
            class="flex items-center gap-2 px-3 py-1.5 bg-pink-50 border-2 border-pink-200 rounded-none mb-2 animate-smooth-appear"
          >
            <app-icons name="pencil" classAttribute="w-4 h-4 text-pink-400"></app-icons>
            <span class="font-pixel text-xs text-pink-500 truncate max-w-48">{{
              selectedFile()!.name
            }}</span>
          </div>
        }

        <button
          type="button"
          class="main-btn flex items-center gap-2 px-5 py-2 font-pixel text-sm text-white tracking-wider mt-2"
          (click)="onSubmit()"
          [disabled]="!selectedFile() || isUploading()"
        >
          @if (isUploading()) {
            <app-icons [name]="'pacman_loading'" [classAttribute]="'size-10'"></app-icons>
          } @else {
            <app-icons name="upload" classAttribute="w-4 h-4 text-white"></app-icons>
          }
          UPLOAD
        </button>

        @if (uploadSuccess()) {
          <div
            class="mt-3 px-4 py-2 bg-green-50 border-2 border-green-300 rounded-none animate-smooth-appear"
          >
            <span class="font-pixel text-xs text-green-600">Upload successful!</span>
          </div>
        }@else if(uploadFail()){
          <div
            class="mt-3 px-4 py-2 bg-red-50 border-2 border-red-300 rounded-none animate-smooth-appear"
          >
            <span class="font-pixel text-xs text-red-600">Upload fail!</span>
          </div>
        }
      </div>

      <div class="w-full h-1 bg-pink-100 border-y-2 border-pink-200 mb-6"></div>

      @if (user()) {
        <div class="space-y-4">
          <div
            class="flex items-center gap-3 px-4 py-3 bg-pink-50/80 border-2 border-pink-200 rounded-none transition-all duration-200 hover:bg-pink-100/80 hover:-translate-y-0.5 hover:shadow-[0_4px_0_#fbcfe8]"
          >
            <div
              class="w-9 h-9 bg-pink-400 border-2 border-pink-500 rounded-none flex items-center justify-center shadow-[2px_3px_0_#db2777]"
            >
              <app-icons name="user" classAttribute="w-5 h-5 text-white"></app-icons>
            </div>
            <div class="flex flex-col min-w-0">
              <span class="font-pixel text-[10px] text-pink-400 tracking-widest uppercase"
                >Username</span
              >
              <span class="font-pixel text-sm md:text-base text-pink-600 truncate">{{
                user()!.username
              }}</span>
            </div>
          </div>

          <div
            class="flex items-center gap-3 px-4 py-3 bg-pink-50/80 border-2 border-pink-200 rounded-none transition-all duration-200 hover:bg-pink-100/80 hover:-translate-y-0.5 hover:shadow-[0_4px_0_#fbcfe8]"
          >
            <div
              class="w-9 h-9 bg-pink-400 border-2 border-pink-500 rounded-none flex items-center justify-center shadow-[2px_3px_0_#db2777]"
            >
              <app-icons name="envelope" classAttribute="w-5 h-5 text-white"></app-icons>
            </div>
            <div class="flex flex-col min-w-0">
              <span class="font-pixel text-[10px] text-pink-400 tracking-widest uppercase"
                >Email</span
              >
              <span class="font-pixel text-sm md:text-base text-pink-600 truncate">{{
                user()!.email
              }}</span>
            </div>
          </div>
        </div>
      }
    </div>

    <div
      class="h-2 bg-pink-300 border-x-4 border-b-4 border-pink-500 rounded-none shadow-[4px_4px_0_#db2777]"
    ></div>
  </div>
</div>
