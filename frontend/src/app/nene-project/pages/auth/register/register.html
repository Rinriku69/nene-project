<section
  class="relative w-full min-h-svh flex justify-center items-center py-10 overflow-hidden bg-pink-50"
>
  <div
    class="absolute inset-0 z-0 opacity-60 bg-[radial-gradient(#fbcfe8_6px,transparent_3px)] bg-size-[40px_40px]"
  ></div>

  <div
    class="relative z-10 w-full max-w-md rounded-[3rem] px-10 py-12 flex flex-col gap-8 bg-white border-4 border-pink-200 shadow-[0_12px_0_#fbcfe8]"
  >
    <div class="text-center">
      <h2 class="text-4xl font-black text-pink-400 drop-shadow-sm tracking-tighter">
        Join the fun! <br />
        🎉💖
      </h2>
    </div>

    <form class="flex flex-col gap-5 w-full">
      <div class="flex flex-col gap-2">
        <label class="text-pink-400 font-bold ml-4">Name</label>
        <input
          type="text"
          placeholder="What do we call you?"
          class="w-full px-6 py-4 rounded-full bg-pink-50 border-2 border-pink-200 text-pink-500 font-medium placeholder-pink-300 focus:outline-none focus:border-pink-400 focus:ring-4 focus:ring-pink-100 transition-all"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-pink-400 font-bold ml-4">Username</label>
        <input
          type="text"
          placeholder="Pick a cute username!"
          class="w-full px-6 py-4 rounded-full bg-pink-50 border-2 border-pink-200 text-pink-500 font-medium placeholder-pink-300 focus:outline-none focus:border-pink-400 focus:ring-4 focus:ring-pink-100 transition-all"
        />
      </div>

      <div class="flex flex-col gap-2">
        <label class="text-pink-400 font-bold ml-4">Password</label>
        <input
          type="password"
          placeholder="Make it super secret!"
          class="w-full px-6 py-4 rounded-full bg-pink-50 border-2 border-pink-200 text-pink-500 font-medium placeholder-pink-300 focus:outline-none focus:border-pink-400 focus:ring-4 focus:ring-pink-100 transition-all"
        />
      </div>

      <button type="button" class="main-btn group mt-4 w-full flex justify-center items-center">
        <span
          class="text-2xl font-black text-white group-hover:scale-110 transition-transform duration-300"
        >
          Sign Up 🚀
        </span>
      </button>
    </form>

    <div class="text-center mt-2">
      <p class="text-pink-400 font-medium">
        Already our bestie?
        <a
          routerLink="/auth/login"
          class="text-pink-500 font-bold hover:text-pink-400 underline decoration-2 decoration-pink-300 underline-offset-4 cursor-pointer"
        >
          Log in! 💌
        </a>
      </p>
    </div>
  </div>
</section>
