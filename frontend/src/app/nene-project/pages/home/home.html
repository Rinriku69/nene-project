<section class="relative w-full h-svh flex flex-col gap-5 justify-center items-center overflow-hidden ">
  <div class="fixed inset-0 z-1 bg-pink-50 opacity-80 animate-pulse">
  </div>
  <div
    class="fixed inset-0 z-0 opacity-60 bg-[radial-gradient(#fbcfe8_6px,transparent_3px)] bg-size-[40px_40px]"
  ></div>
  <h1 class="absolute top-[15%] z-200 font-pixel text-4xl md:text-5xl font-black text-pink-400">Nene Project</h1>
  <div
    class="relative z-10 rounded-none px-10 py-16 md:px-20 md:py-20 flex flex-col items-center gap-10 bg-white border-2 border-pink-200 shadow-[8px_12px_0_#fbcfe8] hover:-translate-y-2 hover:shadow-[0_20px_0_#fbcfe8] transition-all duration-300"
  >
    <div class="text-center animate-bounce">
      <h2 class="text-4xl md:text-7xl font-pixel text-pink-400 drop-shadow-sm tracking-tighter">
        Hi Cutie! <br />
        ૮ ˶ᵔ ᵕ ᵔ˶ ა
      </h2>
    </div>

    <div>
      <button class="main-btn py-2 px-8 group flex justify-end gap-2" (click)="boopClick()">
        <app-icons
          [name]="'pointer'"
          [classAttribute]="'size-8 md:size-15 text-white group-hover:scale-110 transition-transform mr-3'"
        ></app-icons>
        <span
          class="flex items-center text-lg font-pixel md:text-3xl font-black text-white group-hover:scale-110 group-hover:rotate-3 transition-transform duration-300"
        >
          Boop Me!
        </span>
      </button>
    </div>
  </div>
</section>
